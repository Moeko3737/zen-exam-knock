<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ZEN Exam Knock</title>

  <link rel="stylesheet" href="./src/css/style.css">
</head>

<body>

  <header>
    <h1>ZEN Exam Knock</h1>
    <p>授業内容をクイズ形式で復習できる試験対策サイト</p>
  </header>

<main>
  <!-- 科目選択 -->
  <section
    class="subject-section"
    id="subject-section"
    aria-labelledby="subject-heading"
  >
    <h2 id="subject-heading">科目を選択</h2>

    <div class="subject-list">
      <button
        type="button"
        class="subject-card"
        data-subject="python"
        data-subject-name="Pythonプログラミング"
      >
        <span class="subject-name">Pythonプログラミング</span>
        <span class="subject-info">全15回</span>
      </button>

      <button
        type="button"
        class="subject-card"
        data-subject="webapp2"
        data-subject-name="Webアプリケーション開発2"
      >
        <span class="subject-name">Webアプリケーション開発2</span>
        <span class="subject-info">全15回</span>
      </button>
    </div>
  </section>


  <!-- 学習モード選択 -->
  <section
    class="mode-section"
    id="mode-section"
    aria-labelledby="mode-heading"
    hidden
  >
  <button type="button" id="back-to-subject">
  ← 科目選択に戻る
</button>
    <p id="selected-subject-name"></p>

    <h2 id="mode-heading">学習モードを選択</h2>

    <div class="mode-list">
      <button type="button" class="mode-card" data-mode="lesson">
        回を指定して20問
      </button>

      <button type="button" class="mode-card" data-mode="mix">
        全範囲MIX
      </button>

      <button type="button" class="mode-card" data-mode="knock100">
        100問ノック
      </button>

      <button type="button" class="mode-card" data-mode="mistakes">
        間違えた問題の復習
      </button>
    </div>
  </section>
</main>

  <script src="./src/js/app.js"></script>

</body>

</html>
