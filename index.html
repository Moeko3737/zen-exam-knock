<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ZEN Exam Knock</title>

  <link rel="stylesheet" href="./src/css/style.css">
</head>

<body>

  <header>
    <h1>ZEN Exam Knock</h1>
    <p>授業内容をクイズ形式で復習できる試験対策サイト</p>
  </header>

  <main>

    <!-- ========================================
         科目選択
    ========================================= -->
    <section
      class="subject-section"
      id="subject-section"
      aria-labelledby="subject-heading"
      hidden
    >
      <h2 id="subject-heading">科目を選択</h2>

      <div class="subject-list">

        <button
          type="button"
          class="subject-card"
          data-subject="python"
        >
          <span class="subject-name">
            Pythonプログラミング
          </span>

          <span class="subject-info">
            全15回
          </span>
        </button>

        <button
          type="button"
          class="subject-card"
          data-subject="webapp2"
        >
          <span class="subject-name">
            Webアプリケーション開発2
          </span>

          <span class="subject-info">
            全15回
          </span>
        </button>

      </div>
    </section>


    <!-- ========================================
         学習モード選択
    ========================================= -->
    <section
      class="mode-section"
      id="mode-section"
      aria-labelledby="mode-heading"
      hidden
    >
      <button
        type="button"
        class="back-button"
        id="back-to-subject"
      >
        ← 科目選択に戻る
      </button>

      <p id="selected-subject-name"></p>

      <h2 id="mode-heading">学習モードを選択</h2>

      <div class="mode-list">

        <button
          type="button"
          class="mode-card"
          data-mode="lesson"
        >
          回を指定して20問
        </button>

        <button
          type="button"
          class="mode-card"
          data-mode="mix"
        >
          全範囲MIX
        </button>

        <button
          type="button"
          class="mode-card"
          data-mode="knock100"
        >
          100問ノック
        </button>

        <button
          type="button"
          class="mode-card"
          data-mode="mistakes"
        >
          間違えた問題の復習
        </button>

      </div>
    </section>


    <!-- ========================================
         授業回選択
    ========================================= -->
    <section
      class="lesson-section"
      id="lesson-section"
      aria-labelledby="lesson-heading"
      hidden
    >
      <button
        type="button"
        class="back-button"
        id="back-to-mode"
      >
        ← 学習モード選択に戻る
      </button>

      <p id="lesson-subject-name"></p>

      <h2 id="lesson-heading">授業回を選択</h2>

      <div
        class="lesson-list"
        id="lesson-list"
      ></div>
    </section>

<!-- ========================================
     問題画面
======================================== -->
    <section
      class="quiz-section"
      id="quiz-section"
      aria-labelledby="quiz-heading"
      hidden
    >
      <button
        type="button"
        class="back-button"
        id="back-to-lesson"
      >
        ← 授業回選択に戻る
      </button>

      <p id="quiz-subject-name"></p>
      <p id="quiz-lesson-name"></p>

      <p id="question-progress"></p>

      <h2 id="quiz-heading" class="question-text"></h2>

      <div
        class="choice-list"
        id="choice-list"
      ></div>
      <div
        class="answer-feedback"
        id="answer-feedback"
        role="status"
        aria-live="polite"
        hidden
      >
        <p id="answer-result"></p>
        <p id="answer-explanation"></p>
      </div>
      <button
        type="button"
        class="next-button"
        id="next-question"
        hidden
      >
        次の問題へ
      </button>
    </section>
    <!-- ========================================
        結果画面
    ======================================== -->
    <section
      class="result-section"
      id="result-section"
      aria-labelledby="result-heading"
      hidden
    >
      <p id="result-subject-name"></p>
      <p id="result-lesson-name"></p>

      <h2 id="result-heading">結果</h2>

      <div class="result-summary">
        <p>
          正解数
          <strong id="result-score"></strong>
        </p>

        <p>
          正答率
          <strong id="result-rate"></strong>
        </p>
      </div>

      <div class="result-actions">
        <button
          type="button"
          id="retry-quiz"
        >
          もう一度挑戦
        </button>

        <button
          type="button"
          class="back-button"
          id="result-to-lesson"
        >
          ← 授業回選択に戻る
        </button>
      </div>
    </section>
  </main>


  <script type="module" src="./src/js/app.js"></script>

</body>

</html>
