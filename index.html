<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>ZEN Exam Knock</title>

  <link
    rel="stylesheet"
    href="./src/css/style.css"
  >
</head>

<body>

  <!-- ========================================
       ヘッダー
  ========================================= -->
  <header class="site-header">
    <div class="header-inner">

      <h1 class="site-title">
        ZEN Exam Knock
      </h1>

      <p class="site-description">
        授業内容をクイズ形式で復習できる試験対策サイト
      </p>

    </div>
  </header>


  <!-- ========================================
       メインコンテンツ
  ========================================= -->
  <main>


    <!-- ========================================
         科目選択
    ========================================= -->
    <section
      class="subject-section"
      id="subject-section"
      aria-labelledby="subject-heading"
      hidden
    >

      <h2 id="subject-heading">
        科目を選択
      </h2>

      <div class="subject-list">


        <!-- Python -->
        <button
          type="button"
          class="subject-card"
          data-subject="python"
        >
          <span class="subject-name">
            Pythonプログラミング
          </span>

          <span class="subject-info">
            全15回
          </span>
        </button>


        <!-- Webアプリ -->
        <button
          type="button"
          class="subject-card"
          data-subject="webapp2"
        >
          <span class="subject-name">
            Webアプリケーション開発2
          </span>

          <span class="subject-info">
            全15回
          </span>
        </button>


        <!-- 情報倫理 -->
        <button
          type="button"
          class="subject-card"
          data-subject="ethics"
        >
          <span class="subject-name">
            情報倫理と法
          </span>

          <span class="subject-info">
            全15回
          </span>
        </button>


      </div>

    </section>


    <!-- ========================================
         学習モード選択
    ========================================= -->
    <section
      class="mode-section"
      id="mode-section"
      aria-labelledby="mode-heading"
      hidden
    >

      <button
        type="button"
        class="back-button"
        id="back-to-subject"
      >
        ← 科目選択に戻る
      </button>


      <p
        class="screen-subject-name"
        id="selected-subject-name"
      ></p>


      <h2 id="mode-heading">
        学習方法を選択
      </h2>


      <div class="mode-list">


        <button
          type="button"
          class="mode-card"
          data-mode="lesson"
        >
          <span class="mode-name">
            回を指定して学習
          </span>

          <span class="mode-info">
            授業回を選んで全問に挑戦
          </span>
        </button>


        <button
          type="button"
          class="mode-card"
          data-mode="mix"
        >
          <span class="mode-name">
            全範囲MIX 20問
          </span>

          <span class="mode-info">
            全授業回からランダムに20問
          </span>
        </button>


        <button
          type="button"
          class="mode-card"
          data-mode="knock100"
        >
          <span class="mode-name">
            100問ノック
          </span>

          <span class="mode-info">
            全授業回からランダムに100問
          </span>
        </button>


        <button
          type="button"
          class="mode-card"
          data-mode="mistakes"
        >
          <span class="mode-name">
            間違えた問題の復習
          </span>

          <span class="mode-info">
            間違えた問題だけを再挑戦
          </span>
        </button>


      </div>

    </section>


    <!-- ========================================
         授業回選択
    ========================================= -->
    <section
      class="lesson-section"
      id="lesson-section"
      aria-labelledby="lesson-heading"
      hidden
    >

      <button
        type="button"
        class="back-button"
        id="back-to-mode"
      >
        ← 学習方法に戻る
      </button>


      <p
        class="screen-subject-name"
        id="lesson-subject-name"
      ></p>


      <h2 id="lesson-heading">
        授業回を選択
      </h2>


      <div
        class="lesson-list"
        id="lesson-list"
      ></div>

    </section>


    <!-- ========================================
         問題画面
    ========================================= -->
    <section
      class="quiz-section"
      id="quiz-section"
      aria-labelledby="quiz-heading"
      hidden
    >

      <button
        type="button"
        class="back-button"
        id="back-to-lesson"
      >
        ← 戻る
      </button>


      <!-- 問題の情報 -->
      <div class="quiz-meta">

        <div class="quiz-meta-left">

          <p id="quiz-subject-name"></p>

          <p id="quiz-lesson-name"></p>

          <p
            id="quiz-question-source"
            hidden
          ></p>

        </div>

        <p id="question-progress"></p>

      </div>


      <!-- 問題文 -->
      <h2
        id="quiz-heading"
        class="question-text"
      ></h2>


      <!-- 選択肢 -->
      <div
        class="choice-list"
        id="choice-list"
      ></div>


      <!-- 正誤・解説 -->
      <div
        class="answer-feedback"
        id="answer-feedback"
        role="status"
        aria-live="polite"
        hidden
      >

        <p id="answer-result"></p>

        <p id="answer-explanation"></p>

      </div>


      <!-- 次へ -->
      <button
        type="button"
        class="next-button"
        id="next-question"
        hidden
      >
        次の問題へ
      </button>

    </section>


    <!-- ========================================
         結果画面
    ========================================= -->
    <section
      class="result-section"
      id="result-section"
      aria-labelledby="result-heading"
      hidden
    >

      <p
        class="screen-subject-name"
        id="result-subject-name"
      ></p>

      <p
        class="result-lesson-name"
        id="result-lesson-name"
      ></p>


      <h2 id="result-heading">
        結果
      </h2>


      <div class="result-summary">

        <div class="result-item">

          <span class="result-label">
            正解数
          </span>

          <strong id="result-score"></strong>

        </div>


        <div class="result-item">

          <span class="result-label">
            正答率
          </span>

          <strong id="result-rate"></strong>

        </div>

      </div>


      <div class="result-actions">

        <button
          type="button"
          class="primary-button"
          id="retry-quiz"
        >
          もう一度挑戦
        </button>


        <button
          type="button"
          class="secondary-button"
          id="result-to-lesson"
        >
          ← 授業回選択に戻る
        </button>

      </div>

    </section>


  </main>


  <!-- ========================================
       JavaScript
  ========================================= -->
  <script
    type="module"
    src="./src/js/app.js"
  ></script>

</body>
</html>
